# Runtime defaults. CLI flags override these; section numbers refer to CLAUDE.md.

providers:
  tokenfactory:
    base_url: https://api.tokenfactory.nebius.com/v1/
    api_key_env: NEBIUS_API_KEY
  nvidia:                       # reference replay only (§11.6)
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    rpm: 20

# Client and pacing (§8)
rpm: 40                         # ceiling; the pacer also caps at 0.8 x x-ratelimit-limit-requests
concurrency: 6
connect_timeout_s: 10
read_timeout_s: 600             # Ultra reasoning can be slow

# Sampling, max_tokens and the thinking switch are part of the pre-registered design, so they
# live in src/second_opinion/contracts/base.py (and in the registry hash), not here.

# Budget (§8): SECOND_OPINION_BUDGET_USD overrides
budget_usd: 40

# Stages and statistics (§8, §9)
n_screen: 50
n_escalate: 300
alpha: 0.01

# Model discovery (§3)
discovery:
  include: [nemotron]
  exclude: [VL, Omni, Safety, embed, rerank]

# NVIDIA-hosted counterparts for the reference replay (§11.6), by role; checked 2026-10-23 against the
# public GET /v1/models. Plain Nemotron 3 Nano has no counterpart there, so Nano findings stay unknown.
reference_models:
  lightning: nvidia/nemotron-3.5-lightning-30b-a3b
  super: nvidia/nemotron-3-super-120b-a12b
  ultra: nvidia/nemotron-3-ultra-550b-a55b
