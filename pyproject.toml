[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "second-opinion"
version = "0.1.0"
description = "Conversion-layer contract checker, docs verifier, and statistical root-cause investigator for NVIDIA Nemotron models on Nebius Token Factory."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.20.0",
    "scipy>=1.11.0",
    "numpy>=1.26.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
second-opinion = "second_opinion.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
second_opinion = [
    "fixtures/schemas/*.json",
    "fixtures/tools/*.json",
    "report/templates/*.j2",
]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
testpaths = ["tests"]
markers = [
    "live: marks tests that make live network API calls",
]
asyncio_mode = "auto"
